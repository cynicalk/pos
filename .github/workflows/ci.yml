name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — migrate + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Match the creds the test/migrate scripts hardcode (see backend/package.json).
        env:
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: pos_password
          POSTGRES_DB: pos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos_user -d pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run migrate:test
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontends:
    name: Frontends — build + typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, admin, menu, guest-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      # The guest app is TypeScript — typecheck it; the Vite apps just build.
      - if: matrix.app == 'guest-app'
        run: npm run typecheck
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}
